<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For You ❤️</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
        }

        body {

            margin: 0;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ffe4ec,
                    #ffd1dc
                );

            overflow-x: hidden;
        }


        /* =================================
           หน้าหลัก
        ================================= */

        .page {

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 30px 15px 100px;
        }


        /* =================================
           รูปภาพ
        ================================= */

        .photo-love {

            width: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            position: relative;

            margin-bottom: 30px;
        }


        .photo {

            width: min(38vw, 180px);

            aspect-ratio: 3 / 4;

            object-fit: cover;

            border-radius: 15px;

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.2);
        }


        .photo-left {

            transform:
                rotate(-8deg)
                translateX(10px);
        }


        .photo-right {

            transform:
                rotate(8deg)
                translateX(-10px);
        }


        /* =================================
           หัวใจ
        ================================= */

        .heart {

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            z-index: 5;

            font-size:
                clamp(40px, 12vw, 60px);

            filter:
                drop-shadow(
                    0 4px 8px
                    rgba(0, 0, 0, 0.2)
                );

            animation:
                heartbeat
                1s
                infinite
                ease-in-out;
        }


        @keyframes heartbeat {

            0%,
            100% {
                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            50% {
                transform:
                    translate(-50%, -50%)
                    scale(1.2);
            }
        }


        /* =================================
           ปุ่ม
        ================================= */

        .music-button {

            border: none;

            padding:
                13px 25px;

            border-radius: 15px;

            background: white;

            color: #d63384;

            font-size: 16px;

            font-weight: bold;

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.15);

            cursor: pointer;

            margin-bottom: 30px;
        }


        .music-button:active {

            transform: scale(0.95);
        }


        /* =================================
           กล่องข้อความ
        ================================= */

        .text-box {

            width: min(90%, 500px);

            margin: 0 auto;

            padding:
                30px 20px;

            background: #d63384;

            border-radius: 30px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.2);

            text-align: center;

            /* ซ่อนไว้ก่อน */

            display: none;
        }


        /* ตอนเปิด */

        .text-box.show {

            display: block;

            animation:
                showMessage
                1s
                ease forwards;
        }


        @keyframes showMessage {

            from {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(0.95);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =================================
           หัวข้อ
        ================================= */

        .text-box h1 {

            margin:
                0 0 20px;

            color: white;

            font-family:
                'Dancing Script',
                cursive;

            font-size:
                clamp(45px, 13vw, 70px);
        }


        /* =================================
           ข้อความ
        ================================= */

        .text-box h3 {

            margin: 0;

            color: white;

            font-size:
                clamp(14px, 4vw, 18px);

            line-height: 1.8;

            font-weight: normal;
        }


        /* =================================
           มือถือ
        ================================= */

        @media (max-width: 600px) {

            .page {

                padding:
                    20px 10px 40px;
            }


            .photo-love {

                margin-bottom: 20px;
            }


            .photo {

                width: 38vw;

                max-width: 150px;
            }


            .heart {

                font-size: 45px;
            }


            .music-button {

                font-size: 15px;

                padding:
                    12px 22px;
            }


            .text-box {

                width: 92%;

                padding:
                    25px 15px;

                border-radius: 25px;
            }


            .text-box h1 {

                font-size: 48px;
            }


            .text-box h3 {

                font-size: 14px;

                line-height: 1.7;
            }
        }


        /* =================================
           มือถือจอเล็ก
        ================================= */

        @media (max-width: 380px) {

            .photo {

                width: 37vw;
            }


            .heart {

                font-size: 40px;
            }


            .text-box {

                width: 94%;

                padding:
                    20px 12px;
            }


            .text-box h1 {

                font-size: 42px;
            }


            .text-box h3 {

                font-size: 13px;
            }
        }

    </style>

</head>


<body>


    <main class="page">


        <!-- =============================
             รูป
        ============================== -->

        <div class="photo-love">

            <img
                src="photo1.jpg"
                class="photo photo-left"
                alt="รูปของเรา"
            >

            <div class="heart">
                ❤️
            </div>

            <img
                src="photo2.jpg"
                class="photo photo-right"
                alt="รูปของเรา"
            >

        </div>


        <!-- =============================
             ปุ่มเปิดเพลง
        ============================== -->

        <button
            class="music-button"
            id="musicButton"
        >
            💌 เปิดเพลง
        </button>


        <!-- =============================
             เพลง
        ============================== -->

        <audio
            id="son"
            preload="auto"
        >

            <source
                src="son.mp3"
                type="audio/mpeg"
            >

        </audio>


        <!-- =============================
             ข้อความ
        ============================== -->

        <div
            class="text-box"
            id="message"
        >

            <h1>
                รักนะ ❤️
            </h1>


            <h3>

                เรารักหอมมากนะ<br>

                อยากให้อยู่ด้วยกันแบบนี้
                ไปนาน ๆ เลย

                <br><br>

                เราอาจจะไม่ค่อยเก่งเรื่องพูด<br>

                บางทีเราอาจไม่รู้ว่าจะพูดอะไรดี<br>

                แต่เราอยากให้หอมรู้ไว้นะว่า<br>

                เราดีใจมากที่มีหอมเข้ามาในชีวิต

                <br><br>

                ขอบคุณที่อยู่ข้าง ๆ กันนะ<br>

                รักหอมนะ ❤️ 

            </h3>

        </div>


    </main>


    <script>

        const button =
            document.getElementById("musicButton");

        const song =
            document.getElementById("son");

        const message =
            document.getElementById("message");


        button.addEventListener(
            "click",
            function () {

                /* เล่นเพลง */

                song.play()
                    .catch(function (error) {

                        console.log(
                            "ไม่สามารถเล่นเพลง:",
                            error
                        );

                    });


                /* แสดงข้อความ */

                message.classList.add("show");


                /* เปลี่ยนข้อความปุ่ม */

                button.textContent =
                    "❤️ กำลังเล่นเพลง";


            }
        );

    </script>


</body>

</html>
